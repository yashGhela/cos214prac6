services:
  workflow_dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 5Guys_TIVIDY
    command: ["make", "run"]
    stdin_open: true   # the program reads menu choices from the keyboard
    tty: true

  workflow_valgrind:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    command: ["make", "valgrind"]
    stdin_open: true
    tty: true

  workflow_gdb:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["tools"]
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    command: ["gdb", "./TIVIDY"]